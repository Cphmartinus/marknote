name: MarkNote (Windows build)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v1.0.0 (leave empty to only build)'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win portable nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MarkNote-windows
          path: dist/*.exe
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version != '' && inputs.version || github.ref_name }}
        run: gh release create "$TAG" dist/*.exe --target "${{ github.sha }}" --title "MarkNote $TAG" --generate-notes
