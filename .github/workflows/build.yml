name: MarkNote (Windows build)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win portable nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: MarkNote-windows
          path: dist/*.exe
